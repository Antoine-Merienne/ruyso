[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruyso-app"
version = "0.1.0"
description = "Visual data science pipeline builder - Layers 1 (node model) & 2 (execution engine)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "networkx",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
