name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs this first: nothing is built from a red suite.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor requires-python claims, and what the installers ship.
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries required by PySide6 (headless Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Install package, dev, and ui dependencies
        run: pip install -e ".[dev,ui]"

      - name: Run test suite (Qt in offscreen mode, no display server needed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
